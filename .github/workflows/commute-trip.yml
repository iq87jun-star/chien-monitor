# お休みの日に自転車で出かける時の、行き・現地・帰りの天気を Discord に送る(commute/)。
#   手動実行だけ。スマホの GitHub アプリでも Actions → commute-trip → Run workflow から送れる
#   行き先は住所・施設名・「緯度,経度」。所要時間は自転車 18km/h・道のりは直線の 1.3 倍として計算(commute/config.json の bike)
# リポジトリには書き込まない。
#
# Secrets: COMMUTE_DISCORD_WEBHOOK … 通知先(通勤の天気と同じ)

name: commute-trip

on:
  workflow_dispatch:
    inputs:
      place:
        description: "行き先(例: アルプス公園、安曇野市穂高、36.26,137.95)"
        type: string
        required: true
      date:
        description: "日付(例: 明日、11/8。空なら今日)"
        type: string
        default: "明日"
      arrive:
        description: "到着時刻(例: 10:00、10時)"
        type: string
        required: true
      end:
        description: "終了時刻(例: 15:00、15時半は 15:30)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: commute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node run.js
        env:
          TRIP_PLACE: ${{ inputs.place }}
          TRIP_DATE: ${{ inputs.date }}
          TRIP_ARRIVE: ${{ inputs.arrive }}
          TRIP_END: ${{ inputs.end }}
          COMMUTE_DISCORD_WEBHOOK: ${{ secrets.COMMUTE_DISCORD_WEBHOOK }}
