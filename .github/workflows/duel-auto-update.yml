# 遊戯王海外相場モニター 自動更新パイプライン
# YGOPRODeckの価格を1日2回取得し、履歴を蓄積して騰落を検知、
# 変化があればAI記事を生成してGitHub Pages(pocketduel.tokyo)へ再デプロイする。
#
# Secrets(任意・未設定の機能は自動スキップ):
#   ANTHROPIC_API_KEY  … AI記事生成
#   DUEL_X_API_KEY / DUEL_X_API_SECRET / DUEL_X_ACCESS_TOKEN /
#     DUEL_X_ACCESS_TOKEN_SECRET … X(Twitter)速報(遊戯王bot垢)
#   TORECA_DEPLOY_TOKEN … デプロイ用PAT(toreca用と共用。PAT側で公開リポジトリを追加すること)
#   DUEL_DEPLOY_REPO   … 公開用リポジトリ("owner/repo" 形式)

name: duel-auto-update

on:
  schedule:
    - cron: "51 9 * * *" # 1日1回(UTC 9:51 = JST 18:51)。他サイトのワークフローと時間をずらす
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duel-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # step単位のif式ではsecretsコンテキストが使えないため、一度envに写して判定する
    env:
      TORECA_DEPLOY_TOKEN: ${{ secrets.TORECA_DEPLOY_TOKEN }}
      DUEL_DEPLOY_REPO: ${{ secrets.DUEL_DEPLOY_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duel/package-lock.json

      - name: Run pipeline and build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUEL_X_API_KEY: ${{ secrets.DUEL_X_API_KEY }}
          DUEL_X_API_SECRET: ${{ secrets.DUEL_X_API_SECRET }}
          DUEL_X_ACCESS_TOKEN: ${{ secrets.DUEL_X_ACCESS_TOKEN }}
          DUEL_X_ACCESS_TOKEN_SECRET: ${{ secrets.DUEL_X_ACCESS_TOKEN_SECRET }}
        run: |
          set -e
          cd duel
          npm ci
          npm run pipeline
          npm run build

      - name: Commit updated data
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add duel/data duel/content
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: auto-update duel market data [skip ci]"
            # 他サイトの自動更新ワークフローと同時に走った場合に備えてrebaseしつつプッシュ
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep $((i * 5))
            done
          fi

      - name: Deploy to external gh-pages
        # デプロイ先リポジトリのSecretsが未設定の間はスキップ(データ更新だけでも動く)
        if: ${{ env.TORECA_DEPLOY_TOKEN != '' && env.DUEL_DEPLOY_REPO != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.TORECA_DEPLOY_TOKEN }}
          external_repository: ${{ secrets.DUEL_DEPLOY_REPO }}
          publish_dir: duel/dist
          cname: pocketduel.tokyo
