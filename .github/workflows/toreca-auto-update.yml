# ポケカ海外相場モニター 自動更新パイプライン
# 定期更新は停止中。手動実行か、同じサイトで配信している物(Excel アドイン等)が変わったときだけ動く。
# 変化があればAI記事を生成し、デプロイ先が設定されていればGitHub Pagesへ再デプロイする。
#
# Secrets(任意・未設定の機能は自動スキップ):
#   ANTHROPIC_API_KEY  … AI記事生成
#   X(Twitter)速報は停止中(X_* / TORECA_X_* を渡さないので、投稿処理は自動でスキップされる)
#   TORECA_DEPLOY_TOKEN / TORECA_DEPLOY_REPO … 別リポジトリのgh-pagesへのデプロイ
#     (ジャンルが違うためgame-souba.comとはドメイン・リポジトリを分ける方針。
#      TORECA_DEPLOY_REPO は "owner/repo" 形式)

name: toreca-auto-update

on:
  # 定期更新は停止中(サイト運営の縮小)。再開するときは下の2行のコメントを外す
  # schedule:
  #   - cron: "17 9,21 * * *" # 1日2回(UTC)。Cardmarket更新(8時UTC頃)の後
  workflow_dispatch:
  # 同じサイトで配信している物(Excel アドイン・プライバシーポリシー等)が main で変わったら、すぐ配信し直す
  push:
    branches: [main]
    paths:
      - "excel-addin/**"
      - "calc-api/src/**"
      - "job-extension/src/parser.js"
      - "realty-extension/src/parser.js"
      - "toreca/public/**"

permissions:
  contents: write

concurrency:
  group: toreca-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # step単位のif式ではsecretsコンテキストが使えないため、一度envに写して判定する
    env:
      TORECA_DEPLOY_TOKEN: ${{ secrets.TORECA_DEPLOY_TOKEN }}
      TORECA_DEPLOY_REPO: ${{ secrets.TORECA_DEPLOY_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: toreca/package-lock.json

      - name: Run pipeline and build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          cd toreca
          npm ci
          npm run pipeline
          npm run build

      - name: Build Excel add-in (pokeca-kaigai.com/excel-addin/ で配信)
        # Excel は関数の本体をこのサイトから読み込むので、毎回のデプロイに必ず含める
        # (含めずにデプロイすると、アドインを入れた人の関数が動かなくなる)
        run: |
          set -e
          cd excel-addin
          npm ci
          npm test
          cp -r dist ../toreca/dist/excel-addin

      - name: Commit updated data
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add toreca/data toreca/content
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: auto-update toreca market data [skip ci]"
            # 他サイトの自動更新ワークフローと同時に走った場合に備えてrebaseしつつプッシュ
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep $((i * 5))
            done
          fi

      - name: Deploy to external gh-pages
        # デプロイ先リポジトリのSecretsが未設定の間はスキップ(データ更新だけでも動く)
        if: ${{ env.TORECA_DEPLOY_TOKEN != '' && env.TORECA_DEPLOY_REPO != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.TORECA_DEPLOY_TOKEN }}
          external_repository: ${{ secrets.TORECA_DEPLOY_REPO }}
          publish_dir: toreca/dist
          cname: pokeca-kaigai.com
