# Cloudflare の Secrets(CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)が正しいかを確かめる(手動実行)。
# 値そのものは表示せず、形(長さ・行数・使える文字か)と、Cloudflare の API で確かめた結果だけを出す。
name: cloudflare-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets の形と Cloudflare での確認
        run: |
          node --input-type=module <<'EOF'
          const out = [];
          const shape = (name, v, re) => {
            if (!v) return out.push(`- ${name}: 未登録`), false;
            const lines = v.split(/\r?\n/).filter((l) => l.trim()).length;
            const t = v.trim();
            out.push(`- ${name}: ${t.length} 文字・${lines} 行・前後の空白 ${v !== t ? "あり" : "なし"}・形 ${re.test(t) ? "OK" : "NG(使えない文字が入っている)"}`);
            return lines === 1 && re.test(t);
          };
          const okToken = shape("CLOUDFLARE_API_TOKEN", process.env.TOKEN, /^[A-Za-z0-9_-]{30,60}$/);
          const okAccount = shape("CLOUDFLARE_ACCOUNT_ID", process.env.ACCOUNT, /^[0-9a-f]{32}$/);
          const token = (process.env.TOKEN ?? "").trim();
          const account = (process.env.ACCOUNT ?? "").trim();
          const api = async (p) => {
            const r = await fetch(`https://api.cloudflare.com/client/v4${p}`, { headers: { Authorization: `Bearer ${token}` } });
            const j = await r.json().catch(() => ({}));
            return { ok: r.ok && j.success, status: r.status, msg: (j.errors ?? []).map((e) => `${e.code} ${e.message}`).join("; ") };
          };
          if (okToken) {
            const v = await api("/user/tokens/verify");
            out.push(`- トークンの確認: ${v.ok ? "有効" : `無効(${v.status} ${v.msg})`}`);
            if (v.ok && okAccount) {
              const a = await api(`/accounts/${account}`);
              out.push(`- アカウント ID の確認: ${a.ok ? "このトークンで使える" : `使えない(${a.status} ${a.msg})`}`);
              const d = await api(`/accounts/${account}/d1/database`);
              out.push(`- D1 の権限: ${d.ok ? "OK" : `NG(${d.status} ${d.msg})`}`);
              const w = await api(`/accounts/${account}/workers/subdomain`);
              out.push(`- workers.dev のサブドメイン: ${w.ok ? "設定済み" : `未設定か権限なし(${w.status} ${w.msg})`}`);
            }
          }
          console.log(out.join("\n"));
          const fs = await import("node:fs");
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          EOF
