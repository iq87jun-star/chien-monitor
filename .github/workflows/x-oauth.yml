# X Bot アカウントのアクセストークンを OAuth で発行し、GitHub Secrets に登録する。
# 起動: tools/x-oauth-request.json を書き換えてこのブランチに push する。
# 値(トークン)はワークフロー内だけで扱い、ログには出ない。
name: x-oauth
on:
  push:
    branches: [chore/x-check-creds]
    paths:
      - tools/x-oauth-request.json
permissions:
  contents: read
  issues: write
jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PAT で Secrets を操作できるか確認
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          echo "--- トークンの種類と権限を確認 ---"
          gh api user --jq '.login' 2>&1 | head -3 || echo "(user 取得不可)"
          echo "--- Secrets 一覧の取得を試行 ---"
          gh secret list --repo "${{ github.repository }}" 2>&1 | head -20 || true
          echo "--- 判定 ---"
          if gh secret list --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "OK: Secrets を操作できます"
          else
            echo "NG: Secrets を操作できません。上のエラーを確認してください。"
            exit 1
          fi

      - name: OAuth 認証 → Secrets 登録
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          GH_PAT: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/x-oauth-actions.mjs
