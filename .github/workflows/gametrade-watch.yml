# ゲームトレード新着通知(gametrade-watch/)のテストと Cloudflare へのデプロイ。
# 一覧の取得は Claude の定期実行が relay.mjs で行い、Worker(判定・通知)に送る(クラウドのサーバーからはサイトに接続できないため)。
#   - gametrade-watch/ を変更するPR: 単体テスト
#   - main への push(gametrade-watch/ の変更)・手動実行: テスト → Cloudflare にデプロイ
#
# Secrets:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID … notify と共用
#   GAMETRADE_DISCORD_WEBHOOK                    … 通知先の Discord ウェブフックURL(Worker の Secret に登録する)

name: gametrade-watch

on:
  push:
    branches: [main]
    paths: ["gametrade-watch/**", ".github/workflows/gametrade-watch.yml"]
  pull_request:
    paths: ["gametrade-watch/**", ".github/workflows/gametrade-watch.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gametrade-watch-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GAMETRADE_DISCORD_WEBHOOK: ${{ secrets.GAMETRADE_DISCORD_WEBHOOK }}

defaults:
  run:
    working-directory: gametrade-watch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gametrade-watch/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          node scripts/prepare-deploy.mjs
          npx wrangler d1 migrations apply gametrade-watch --remote
          npx wrangler deploy
      - name: Discord ウェブフックを Worker に登録
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.GAMETRADE_DISCORD_WEBHOOK != ''
        run: printf '%s' "$GAMETRADE_DISCORD_WEBHOOK" | npx wrangler secret put GAMETRADE_DISCORD_WEBHOOK
      - name: Secrets 未設定
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.GAMETRADE_DISCORD_WEBHOOK == '')
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / GAMETRADE_DISCORD_WEBHOOK のいずれかが未設定です(gametrade-watch/README.md 参照)"
