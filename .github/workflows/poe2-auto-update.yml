# ゲーム相場モニター群 自動更新パイプライン
# 更新を続けているのは ff14 だけ。変化があればAI記事を生成してGitHub Pagesへ再デプロイする。
# poe2 / poe1 / tarkov は更新停止中で、保存済みのデータのままページだけ作り直す
# (game-souba.com 内のリンク切れを防ぐため)。
# X への自動投稿は全サイトで停止中(X_* を渡さないので、投稿処理は自動でスキップされる)。
#
# Secrets(任意・未設定の機能は自動スキップ):
#   ANTHROPIC_API_KEY(FF14 の AI 記事)

name: poe2-auto-update

on:
  schedule:
    - cron: "23 22 * * *" # 1日1回(JST 7:23)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poe2-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poe2/package-lock.json

      - name: Run pipelines and build all sites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          for site in poe2 poe1 tarkov ff14; do
            echo "===== $site ====="
            if [ "$site" = "ff14" ]; then
              (cd "$site" && npm ci && npm run pipeline && npm run build)
            else
              # 更新停止中: データ取得・記事生成は行わず、保存済みデータでビルドだけ行う
              (cd "$site" && npm ci && npm run build)
            fi
          done

      - name: Commit updated data
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add poe2/data poe2/content poe1/data poe1/content tarkov/data tarkov/content ff14/data ff14/content
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: auto-update market data [skip ci]"
            git push
          fi

      - name: Assemble combined site
        run: |
          mkdir -p site-dist
          cp portal/index.html site-dist/index.html
          cp portal/robots.txt portal/ogp.png portal/privacy.html site-dist/
          # Playストア掲載用素材(スマホから直接ダウンロードできるよう配信)
          cp -r portal/play-assets site-dist/play-assets
          # Android(TWA)アプリのドメイン所有証明
          mkdir -p site-dist/.well-known
          cp portal/.well-known/assetlinks.json site-dist/.well-known/
          node scripts/generate-sitemap.mjs
          for site in poe2 poe1 tarkov ff14; do
            cp -r "$site/dist" "site-dist/$site"
          done

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site-dist
          cname: game-souba.com
