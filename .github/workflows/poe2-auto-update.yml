# ゲーム相場モニター群 自動更新パイプライン
# 6時間ごとに各サイト(poe2 / poe1 / tarkov / ff14)のデータを取得し、
# 変化があればAI記事を生成してGitHub Pagesへ再デプロイする。
#
# Secrets(任意・未設定の機能は自動スキップ):
#   ANTHROPIC_API_KEY(AI記事) / X_*(PoE2のX速報) / GGG_*(PoE2ビルド統計)

name: poe2-auto-update

on:
  schedule:
    - cron: "23 */6 * * *" # 6時間ごと(UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poe2-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pipelines and build all sites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GGG_CLIENT_ID: ${{ secrets.GGG_CLIENT_ID }}
          GGG_CLIENT_SECRET: ${{ secrets.GGG_CLIENT_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -e
          for site in poe2 poe1 tarkov ff14; do
            echo "===== $site ====="
            (cd "$site" && npm ci && npm run pipeline && npm run build)
          done

      - name: Commit updated data
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add poe2/data poe2/content poe1/data poe1/content tarkov/data tarkov/content ff14/data ff14/content
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: auto-update market data [skip ci]"
            git push
          fi

      - name: Assemble combined site
        run: |
          mkdir -p site-dist
          cp portal/index.html site-dist/index.html
          for site in poe2 poe1 tarkov ff14; do
            cp -r "$site/dist" "site-dist/$site"
          done

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site-dist
