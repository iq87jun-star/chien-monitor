# ゲーム相場モニター(game-souba.com)自動更新パイプライン
# 運用しているのは ff14 だけ。1日1回データを取得し、変化があればAI記事を生成して
# GitHub Pagesへ再デプロイする。
# poe2 / poe1 / tarkov は運用終了。コードはリポジトリに残しているが、ビルドも配信もしない
# (古いURLは portal/404.html が受けて FF14 へ案内する)。
# X への自動投稿は停止中(X_* を渡さないので、投稿処理は自動でスキップされる)。
# ワークフロー名は実行履歴を引き継ぐため poe2-auto-update のままにしている。
#
# Secrets(任意・未設定の機能は自動スキップ):
#   ANTHROPIC_API_KEY(FF14 の AI 記事)

name: poe2-auto-update

on:
  schedule:
    - cron: "23 22 * * *" # 1日1回(JST 7:23)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poe2-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ff14/package-lock.json

      - name: Run pipeline and build (ff14)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          echo "===== ff14 ====="
          cd ff14
          npm ci
          npm run pipeline
          npm run build

      - name: Commit updated data
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ff14/data ff14/content
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: auto-update market data [skip ci]"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p site-dist
          cp portal/index.html site-dist/index.html
          cp portal/404.html portal/robots.txt portal/ogp.png portal/privacy.html site-dist/
          # Playストア掲載用素材(スマホから直接ダウンロードできるよう配信)
          cp -r portal/play-assets site-dist/play-assets
          # Android(TWA)アプリのドメイン所有証明
          mkdir -p site-dist/.well-known
          cp portal/.well-known/assetlinks.json site-dist/.well-known/
          node scripts/generate-sitemap.mjs
          cp -r ff14/dist site-dist/ff14

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site-dist
          cname: game-souba.com
