# PoE2相場モニター 自動更新パイプライン
# 6時間ごとに相場データを取得し、変化があればAI記事を生成してサイトを再デプロイする。
#
# 必要な設定:
#   - Secrets: ANTHROPIC_API_KEY(未設定でもデータ更新のみ動作する)
#   - Pages: 設定不要(configure-pagesのenablementで自動有効化される)
# ※ scheduleトリガーはデフォルトブランチ上のワークフローにのみ有効。

name: poe2-auto-update

on:
  schedule:
    - cron: "23 */6 * * *" # 6時間ごと(UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poe2-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: poe2/package-lock.json

      - name: Install dependencies
        working-directory: poe2
        run: npm ci

      - name: Run data pipeline (fetch → aggregate → generate)
        working-directory: poe2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run pipeline

      - name: Commit updated data
        run: |
          git config user.name "poe2-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add poe2/data poe2/content
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(poe2): auto-update market data [skip ci]"
            git push
          fi

      - name: Build site
        working-directory: poe2
        run: npm run build

      - name: Enable & configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: poe2/dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
