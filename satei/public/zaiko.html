<!doctype html>
<html lang="ja">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7LZS5DCBSG"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-7LZS5DCBSG');</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>在庫一覧|メルル</title>
<meta name="description" content="メルルが販売中のゲームアカウント(原神・スターレイルなど)と、代理出品中のアカウントの一覧です。価格・ご購入のご相談は X の DM で受け付けています。" />
<meta property="og:title" content="メルル|販売中のアカウント一覧" />
<meta property="og:description" content="メルルの在庫と代理出品中のアカウントをまとめています。" />
<meta name="twitter:card" content="summary" />
<link rel="canonical" href="https://game-souba.com/zaiko/" />
<meta property="og:url" content="https://game-souba.com/zaiko/" />
<style>
  /* 明るい配色で固定(端末のダークモードでも暗くしない) */
  :root {
    --bg: #fff9fc; --card: #ffffff; --ink: #2a2230; --sub: #6b5f72; --line: #f3dde8;
    --accent: #ec4f8c; --accent-ink: #ffffff; --soft: #ffeef5; --sky: #eaf4ff; --sky-ink: #2f6fb3;
    --gold: #8a5a00; --gold-bg: #fff1c9; --ok: #157a4c; --ok-bg: #dff7ea; --warn: #9a5800; --warn-bg: #fff0d6; --mute-bg: #f1edf3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #ffeef6 0, var(--bg) 260px); color: var(--ink); font: 16px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 18px; }
  .kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 10px; }
  .kinds button { padding: 10px 6px; border-radius: 10px; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .kinds button span { display: block; font-size: 12px; font-weight: 400; color: var(--sub); }
  .kinds button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .kinds button[aria-pressed="true"] span { color: var(--accent-ink); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tabs button { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--sky); color: var(--sky-ink); border-color: #b9d7f5; font-weight: 700; }
  h2 { font-size: 20px; margin: 26px 0 10px; padding-left: 10px; border-left: 5px solid var(--accent); }
  h3 { font-size: 15px; color: var(--sub); margin: 14px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(236, 79, 140, .06); display: flex; flex-direction: column; }
  .card.sold { opacity: .55; }
  .cover { position: relative; aspect-ratio: 16 / 9; background: var(--soft); cursor: zoom-in; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover.text { cursor: default; display: flex; flex-direction: column; justify-content: center; padding: 16px 18px; background: linear-gradient(135deg, #ffe3ef, #e8f1ff); }
  .cover.text .big { font-size: 26px; font-weight: 800; line-height: 1.3; }
  .cover.text .big em { color: var(--accent); font-style: normal; }
  .cover.text .small { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .cover .badge { position: absolute; left: 10px; top: 10px; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--mute-bg); }
  .tag.stock { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .tag.consign { background: var(--sky-ink); color: #fff; font-weight: 700; }
  .tag.販売中 { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
  .tag.商談中 { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
  .tag.売約済み { background: var(--mute-bg); color: var(--sub); font-weight: 700; }
  .price { font-size: 15px; font-weight: 700; color: var(--accent); margin: 0; }
  .sum { font-size: 14px; color: var(--sub); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 13px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .chip.c6 { background: var(--gold-bg); color: var(--gold); border-color: transparent; font-weight: 700; }
  .more { font-size: 13px; color: var(--accent); background: none; border: 0; padding: 2px 4px; cursor: pointer; font: inherit; }
  .note { font-size: 14px; margin: 0; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .btn { flex: 1 1 140px; display: inline-block; padding: 11px 14px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
  .btn.sub { background: var(--soft); color: var(--ink); }
  .empty { color: var(--sub); text-align: center; padding: 32px 0; }
  .info { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--sub); margin-top: 24px; }
  .info a, footer a { color: var(--accent); }
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(40, 20, 40, .7); }
  dialog img { max-width: 96vw; max-height: 90vh; display: block; border-radius: 10px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
  footer { color: var(--sub); font-size: 13px; margin-top: 24px; }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>メルルの在庫一覧🌸</h1>
  <p class="lead">メルルが販売しているアカウントと、代理出品中のアカウントです。価格・ご購入のご相談は、番号を添えて X の DM でお気軽にどうぞ。</p>

  <div class="kinds" id="kinds" role="group" aria-label="種類"></div>
  <div class="tabs" id="tabs" role="group" aria-label="ゲーム"></div>
  <div id="list"><p class="empty">読み込み中…</p></div>

  <div class="info">
    <b>ご購入について</b><br />
    ・<b>メルルの在庫</b>はメルルが買い取ったアカウント、<b>代理出品</b>は持ち主の方に代わってメルルが販売するアカウントです。<br />
    ・価格は DM でご案内します。分割払いのご相談も受け付けています。<br />
    ・お支払い・お引き渡しの流れは <a href="/torihiki/">お取引ガイド</a> をご覧ください。
  </div>

  <footer>当サイトは各ゲームの運営会社とは関係のない非公式サイトです。アカウントの売買は各ゲームの規約で禁止されている場合があります。</footer>
</main>
<dialog id="zoom"><img id="zoomImg" alt="" /></dialog>

<script type="module">
import { GAMES, xOf } from "./lib/games.js";
const $ = (id) => document.getElementById(id);
const API = /(^localhost$|\.workers\.dev$)/.test(location.hostname) ? "" : "https://satei.iq87jun.workers.dev";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ORDER = ["genshin-impact", "houkaistarrail", "zzz", "wutheringwaves", "granblue", "umamusume", "identityv"];
// 星5キャラの一覧を持っているゲーム(グラブル・ウマ娘・第五人格は項目の数なので「星5 ○体」を出さない)
const STAR5 = new Set(["genshin-impact", "houkaistarrail", "zzz", "wutheringwaves"]);
const KINDS = { "": ["すべて", "在庫と代理出品"], stock: ["🌸 在庫", "メルルが販売"], consign: ["🤝 代理出品", "お客様のアカウント"] };
const KIND_NAME = { stock: "メルルの在庫", consign: "代理出品" };
const SHOW = 10; // キャラは最初にこの数だけ出す
let items = [];
const q = new URLSearchParams(location.search);
let kind = Object.hasOwn(KINDS, q.get("kind") ?? "") ? q.get("kind") ?? "" : "";
let game = q.get("game") ?? "";

const label = (it) => `${it.kind === "stock" ? "在庫" : "代理出品"} No.${it.no}`;
const sorted = (it) => [...it.chars].sort((a, b) => b.cons - a.cons || Number(b.mochi) - Number(a.mochi));
function chip(c) {
  const cons = c.cons === 6 ? "完凸" : c.cons ? `${c.cons}凸` : "";
  return `<span class="chip${c.cons === 6 ? " c6" : ""}">${esc(c.name)}${cons ? ` ${cons}` : ""}${c.mochi ? "+餅" : ""}</span>`;
}
// 表紙: 画像があればそれ、無ければ文字の表紙
function cover(it, cs) {
  if (it.cover) return `<div class="cover" data-zoom><img src="${API}/api/catalog/image/${it.cover}" alt="${esc(label(it))} の表紙" loading="lazy" /></div>`;
  const c6 = cs.filter((c) => c.cons === 6);
  const top = c6.slice(0, 3).map((c) => c.name).join("・");
  const big = STAR5.has(it.game) && cs.length
    ? (c6.length ? `完凸 <em>${c6.length}体</em>` : `★5キャラ <em>${cs.length}体</em>`)
    : esc(GAMES[it.game] ?? "");
  return `<div class="cover text"><div class="small">${esc(GAMES[it.game] ?? "")} アカウント</div><div class="big">${big}</div>${top ? `<div class="small">${esc(top)}${c6.length > 3 ? " ほか" : ""}</div>` : ""}</div>`;
}
function card(it) {
  const cs = sorted(it);
  const c6 = cs.filter((c) => c.cons === 6).length;
  return `<article class="card${it.state === "売約済み" ? " sold" : ""}" data-key="${it.kind}-${it.no}">
    ${cover(it, cs)}
    <div class="body">
      <div class="head"><span class="tag ${it.kind}">${KIND_NAME[it.kind]}</span><span class="tag">${esc(GAMES[it.game] ?? it.game)}</span><span class="tag ${esc(it.state)}">${esc(it.state)}</span><span class="tag">No.${it.no}</span></div>
      ${it.state === "売約済み" ? "" : `<p class="price">💬 価格は DM でご案内します</p>`}
      ${STAR5.has(it.game) && cs.length ? `<p class="sum">★5 ${cs.length}体${c6 ? `・完凸 ${c6}体` : ""}</p>` : ""}
      ${cs.length ? `<div class="chips">${cs.slice(0, SHOW).map(chip).join("")}${cs.length > SHOW ? `<button class="more" data-more>ほか ${cs.length - SHOW}体を見る</button><span hidden data-rest>${cs.slice(SHOW).map(chip).join("")}</span>` : ""}</div>` : ""}
      ${it.assets ? `<p class="sum">${esc(it.assets)}</p>` : ""}
      ${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}
      ${it.state === "売約済み" ? "" : `<div class="row">
        <button class="btn" data-ask>✉️ DMで価格を聞く</button>
        ${it.post_url ? `<a class="btn sub" href="${esc(it.post_url)}" target="_blank" rel="noopener">紹介ポスト</a>` : ""}
      </div>`}
    </div>
  </article>`;
}
function render() {
  const inKind = items.filter((it) => !kind || it.kind === kind);
  const games = [...new Set(items.map((it) => it.game))].sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  if (game && !games.includes(game)) game = "";
  const live = (list) => list.filter((it) => it.state !== "売約済み").length;
  $("kinds").innerHTML = Object.entries(KINDS)
    .map(([k, [t, s]]) => `<button type="button" data-kind="${k}" aria-pressed="${k === kind}">${t}<span>${s}・${live(items.filter((it) => !k || it.kind === k))}件</span></button>`)
    .join("");
  $("tabs").innerHTML = [["", "すべてのゲーム"], ...games.map((g) => [g, GAMES[g] ?? g])]
    .map(([k, v]) => `<button type="button" data-game="${esc(k)}" aria-pressed="${k === game}">${esc(v)}${k ? ` ${live(inKind.filter((it) => it.game === k))}` : ""}</button>`)
    .join("");
  const shown = games.filter((g) => (!game || g === game) && inKind.some((it) => it.game === g));
  $("list").innerHTML = shown.map((g) => {
    const of = (k) => inKind.filter((it) => it.game === g && it.kind === k);
    const parts = ["stock", "consign"].filter((k) => of(k).length);
    return `<section><h2>${esc(GAMES[g] ?? g)}</h2>${parts
      .map((k) => `${kind ? "" : `<h3>${k === "stock" ? "🌸 メルルの在庫" : KINDS[k][0]}</h3>`}<div class="grid">${of(k).map(card).join("")}</div>`)
      .join("")}</section>`;
  }).join("") || `<p class="empty">いま掲載中のアカウントはありません。ご希望のキャラがあれば DM でご相談ください。</p>`;
}
function setUrl() {
  const p = new URLSearchParams();
  if (kind) p.set("kind", kind);
  if (game) p.set("game", game);
  history.replaceState(null, "", p.size ? `?${p}` : location.pathname);
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

$("kinds").addEventListener("click", (e) => {
  const b = e.target.closest("[data-kind]");
  if (!b) return;
  kind = b.dataset.kind;
  setUrl();
  render();
});
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-game]");
  if (!b) return;
  game = b.dataset.game;
  setUrl();
  render();
});
$("list").addEventListener("click", async (e) => {
  const more = e.target.closest("[data-more]");
  if (more) {
    more.nextElementSibling.hidden = false;
    more.remove();
    return;
  }
  const z = e.target.closest("[data-zoom] img");
  if (z) {
    $("zoomImg").src = z.src;
    $("zoom").showModal();
    return;
  }
  if (!e.target.closest("[data-ask]")) return;
  // 番号入りの文をコピーして、窓口の X を開く
  const it = items.find((x) => `${x.kind}-${x.no}` === e.target.closest("[data-key]").dataset.key);
  const text = `メルルさんの在庫一覧を見ました。${label(it)}(${GAMES[it.game] ?? ""})の価格と詳細を教えてください。`;
  try { await navigator.clipboard.writeText(text); toast("問い合わせ文をコピーしました。X の DM に貼り付けて送ってください"); } catch {}
  open(`https://x.com/${xOf(it.game)}`, "_blank", "noopener");
});
$("zoom").addEventListener("click", () => $("zoom").close());

try {
  const d = await (await fetch(`${API}/api/catalog`)).json();
  if (!d.ok) throw new Error(d.error);
  items = d.items;
  render();
} catch {
  $("list").innerHTML = `<p class="empty">読み込めませんでした。時間をおいて開き直してください。</p>`;
}
</script>
</body>
</html>
