<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light" />
<title>代理出品の状況|メルル</title>
<style>
  :root {
    --bg: #fff9fc; --card: #ffffff; --ink: #2a2230; --sub: #6b5f72; --line: #f3dde8;
    --accent: #ec4f8c; --accent-ink: #ffffff; --soft: #ffeef5; --ok: #157a4c; --ok-bg: #dff7ea; --warn: #b3261e; --warn-bg: #fde8e7; --next-bg: #fff6d9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #ffeef6 0, var(--bg) 240px); color: var(--ink); font: 16px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .lead { color: var(--sub); margin: 0 0 16px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(236, 79, 140, .06); }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .sum div { background: var(--soft); border-radius: 12px; padding: 10px 4px; }
  .sum small { display: block; color: var(--sub); font-size: 12px; }
  .sum b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8fb8, var(--accent)); }
  .count { text-align: right; color: var(--sub); font-size: 13px; margin: 4px 0 0; }
  .next { background: var(--next-bg); border-radius: 12px; padding: 12px 14px; }
  .next.late { background: var(--warn-bg); color: var(--warn); }
  .next b { font-size: 20px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--sub); font-size: 13px; font-weight: 600; }
  td.r, th.r { text-align: right; }
  .st { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .st.paid { background: var(--ok-bg); color: var(--ok); }
  .st.late { background: var(--warn-bg); color: var(--warn); }
  .st.next { background: var(--next-bg); color: #8a5a00; }
  .st.later { background: #f1edf3; color: var(--sub); }
  .chat { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
  .msg { max-width: 85%; display: flex; flex-direction: column; }
  .msg span { padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg small { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .msg.me { align-self: flex-start; } .msg.me span { background: var(--soft); }
  .msg.you { align-self: flex-end; text-align: right; } .msg.you span { background: var(--accent); color: var(--accent-ink); }
  .send { display: flex; gap: 8px; margin-top: 10px; }
  textarea { flex: 1; min-height: 48px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; resize: vertical; }
  button { padding: 10px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; }
  .muted { color: var(--sub); font-size: 13px; }
  .err { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px; }
  .info { font-size: 14px; color: var(--sub); }
  .info a { color: var(--accent); }
  [hidden] { display: none !important; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; margin: 4px 0 8px; }
  .steps div { padding: 10px 2px; border-radius: 10px; background: #f1edf3; color: var(--sub); font-size: 13px; font-weight: 700; }
  .steps div.done { background: var(--ok-bg); color: var(--ok); }
  .steps div.now { background: var(--accent); color: var(--accent-ink); }
  .paused { background: #f1edf3; border-radius: 12px; padding: 10px 14px; color: var(--sub); }
  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  dl.kv dt { color: var(--sub); font-size: 14px; } dl.kv dd { margin: 0; font-weight: 700; }
  dl.kv a { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chips span { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: #fff1c9; color: #8a5a00; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>代理出品の状況🌸</h1>
  <p class="lead" id="who">読み込み中…</p>
  <div id="error" class="err" hidden></div>

  <div id="view" hidden>
    <section class="card">
      <h2>いまの進み具合</h2>
      <div class="steps" id="steps"></div>
      <p class="muted" id="stepNote" style="margin:0"></p>
    </section>

    <section class="card">
      <h2>紹介の内容</h2>
      <dl class="kv" id="info"></dl>
      <div class="chips" id="c6"></div>
    </section>

    <section class="card">
      <h2>💬 メルルへのメッセージ</h2>
      <div class="chat" id="chat"></div>
      <div class="send">
        <textarea id="text" maxlength="1000" placeholder="ご希望額の変更・スクショの追加・ご質問など"></textarea>
        <button id="sendBtn">送信</button>
      </div>
      <p class="muted" id="sendMsg" style="margin:6px 0 0">メルルが確認しだいお返事します。お急ぎの場合は X の DM でもご連絡ください。</p>
    </section>

    <p class="info">このページは出品者様専用です。リンクは他の方に共有しないでください。お取引の流れは <a href="/torihiki/">お取引ガイド</a> をご覧ください。</p>
  </div>
</main>

<script type="module">
import { GAMES } from "./lib/games.js";
const $ = (id) => document.getElementById(id);
const API = /(^localhost$|\.workers\.dev$)/.test(location.hostname) ? "" : "https://satei.iq87jun.workers.dev";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const yen = (v) => (v == null ? "未定" : `${Number(v).toLocaleString("ja-JP")}円`);
const token = new URLSearchParams(location.search).get("t") ?? "";
const STEPS = ["ご相談", "紹介の準備", "紹介中", "成約"];
const NOTE = [
  "メルルがご希望やアカウントの内容を確認しています。",
  "紹介の投稿文と画像を準備しています。",
  "メルルの X と在庫一覧で紹介中です。購入希望の方からご連絡があり次第お知らせします。",
  "成約しました🎉 お引き渡しまで、メルルがご案内します。",
];
let lastMsgs = "";

function fail(msg) {
  $("who").textContent = "";
  $("error").textContent = msg;
  $("error").hidden = false;
  $("view").hidden = true;
}
function renderChat(msgs) {
  const key = JSON.stringify(msgs.map((m) => m.at));
  if (key === lastMsgs) return;
  lastMsgs = key;
  const at = (s) => new Date(s).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  $("chat").innerHTML = msgs.map((m) => `<div class="msg ${m.from_me ? "me" : "you"}"><span>${esc(m.body)}</span><small>${m.from_me ? "メルル" : "あなた"} ・ ${at(m.at)}</small></div>`).join("")
    || `<p class="muted">まだメッセージはありません。ご希望の変更やご質問があればどうぞ。</p>`;
  $("chat").scrollTop = $("chat").scrollHeight;
}
function render(d) {
  $("who").textContent = `${d.name ? `${d.name}様 ・ ` : ""}${GAMES[d.game] ?? ""}アカウント(代理出品 No.${d.no})`;
  if (d.step < 0) {
    $("steps").innerHTML = "";
    $("stepNote").outerHTML = `<p class="paused" id="stepNote">いまは紹介をお休みしています。再開したい場合は、下のメッセージ欄からお知らせください。</p>`;
  } else {
    $("steps").innerHTML = STEPS.map((t, i) => `<div class="${i < d.step ? "done" : i === d.step ? "now" : ""}">${i < d.step ? "✓ " : ""}${t}</div>`).join("");
    $("stepNote").textContent = NOTE[d.step];
  }
  const rows = [
    ["★5キャラ", d.star5 ? `${d.star5}体${d.c6.length ? `(完凸 ${d.c6.length}体)` : ""}` : "確認中"],
    ["ご希望額", yen(d.wish)],
    ["紹介している価格", d.pub_price != null ? yen(d.pub_price) : d.step >= 2 ? "DMでご案内" : "未定"],
    ["在庫一覧への掲載", d.pub ? `<a href="/zaiko/?kind=consign&game=${esc(d.game)}" target="_blank" rel="noopener">掲載中</a>` : "準備中"],
    ["紹介ポスト", d.post_url ? `<a href="${esc(d.post_url)}" target="_blank" rel="noopener">X で見る</a>` : "準備中"],
    ["お問い合わせ", `${d.asks}件`],
    ["最終更新", new Date(d.updated_at).toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo" })],
  ];
  $("info").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${k === "在庫一覧への掲載" || k === "紹介ポスト" ? v : esc(v)}</dd>`).join("");
  $("c6").innerHTML = d.c6.map((n) => `<span>${esc(n)} 完凸</span>`).join("");
  renderChat(d.msgs);
  $("view").hidden = false;
}
async function load() {
  const res = await fetch(`${API}/api/seller/${token}`);
  const d = await res.json();
  if (!d.ok) throw new Error(d.error || res.status);
  render(d);
}

$("sendBtn").addEventListener("click", async () => {
  const body = $("text").value.trim();
  if (!body) return;
  $("sendBtn").disabled = true;
  try {
    const d = await (await fetch(`${API}/api/seller/${token}/msg`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ body }) })).json();
    if (!d.ok) throw new Error(d.error);
    $("text").value = "";
    $("sendMsg").textContent = "送信しました。メルルが確認しだいお返事します。";
    await load();
  } catch (err) {
    $("sendMsg").textContent = `送れませんでした(${err.message})`;
  }
  $("sendBtn").disabled = false;
});

if (!/^[0-9a-f]{32}$/.test(token)) fail("リンクが正しくありません。メルルからお送りしたリンクを、そのまま開いてください。");
else {
  load().catch((err) => fail(`読み込めませんでした(${err.message})。リンクをご確認ください。`));
  setInterval(() => { if (document.visibilityState === "visible") load().catch(() => {}); }, 30_000);
}
</script>
</body>
</html>
