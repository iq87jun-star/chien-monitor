# Cloudflare Worker「メルル査定」。デプロイは GitHub Actions の satei ワークフロー。
name = "satei"
main = "src/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# 画面(public/)は静的アセット。/api/* だけ Worker が受ける
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# 画像読み取りの1日の上限(Claude の利用料の上限にもなる)
DAILY_LIMIT_PER_IP = "5"
DAILY_LIMIT_TOTAL = "200"

[[d1_databases]]
binding = "DB"
database_name = "satei"
# デプロイ時に scripts/prepare-deploy.mjs が実際のIDに書き換える(無ければ作成する)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
