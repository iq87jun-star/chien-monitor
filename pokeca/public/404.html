<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません | ポケカ国内相場モニター</title>
<meta name="robots" content="noindex">
<!-- 旧ブログ「ポケカミン」時代のURL(/archives/等)への残存アクセスをトップへ誘導する。
     GitHub Pagesでは301が使えないため、3秒表示のうえJSで転送する -->
<script>setTimeout(function () { location.replace("/"); }, 3000);</script>
<style>
  body{margin:0;background:#0E1420;color:#E9ECF2;font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;line-height:1.9}
  a{color:#F5CF4A}
  .box{padding:24px}
  h1{font-size:20px;color:#F5CF4A}
  p{font-size:14px;color:#A3AABB}
</style>
</head>
<body>
<div class="box">
  <h1>⚡ ページが見つかりません</h1>
  <p>お探しのページは存在しないか、旧サイト(ポケカミン)時代のURLです。<br>
  このドメインは現在「ポケカ国内相場モニター」として運営されています。<br>
  3秒後にトップページへ移動します → <a href="/">今すぐ移動</a></p>
</div>
</body>
</html>
